<style>
        .card-shadow { box-shadow: 0px 1px 3px rgba(0,0,0,0.05); }
        .hover-lift:hover { box-shadow: 0px 4px 6px rgba(0,0,0,0.1); border-color: rgba(30, 64, 175, 0.2); transform: translateY(-1px); }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-margin font-body-md text-on-surface">
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-8">
<img alt="Tournament Pro Logo" class="w-16 h-16 mx-auto mb-4 rounded-DEFAULT object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1VHzVcgrlrr2xwU1_DxRZgwYLMbeMgF-u4Gt8UPV016pS1B6Wlxc2taPOBzlTJNhwMLKXrRkpMl3QMNJXxNtA_AfegWQwXAcFlYvUppaMHmLzk3_dRgR6f-GPNu3guWU7m85Lu2cZ9uAH1Io8qR1WNqSP0lnsztC6MOWf82u3Q53CRtWFljyLz-cnZlSBul-aOj26HE40GUK2oZXCrlQ-vtmfo8U7UA40NJ2aPsF0eStsbKK-mrW_jirNiX"/>
<h1 class="font-headline-lg text-headline-lg text-primary">Tournament Pro</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Create your account</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant card-shadow p-6 sm:p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="name">Full Name</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest transition-colors" id="name" name="name" required="" type="text"/>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest transition-colors" id="email" name="email" required="" type="email"/>
</div>
<!-- Role Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="role">Role</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface appearance-none focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest transition-colors cursor-pointer" id="role" name="role" required="">
<option disabled="" selected="" value="">Select your role</option>
<option value="coach">Coach</option>
<option value="employee">Employee</option>
<option value="spectator">Spectator</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest transition-colors" id="password" name="password" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="confirm_password">Confirm Password</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest transition-colors" id="confirm_password" name="confirm_password" required="" type="password"/>
</div>
<!-- Terms and Privacy -->
<div class="flex items-start mt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-accent-blue bg-surface-container-low border-outline-variant rounded-DEFAULT focus:ring-accent-blue focus:ring-2" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                            I agree to the <a class="text-accent-blue hover:underline" href="#">Terms of Service</a> and <a class="text-accent-blue hover:underline" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-accent-blue hover:bg-opacity-90 text-on-primary font-title-md text-title-md py-3 px-4 rounded-DEFAULT transition-colors duration-200 shadow-sm flex items-center justify-center gap-2 mt-4 hover-lift" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Login Link -->
<div class="text-center mt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-accent-blue font-title-md text-title-md hover:underline ml-1" href="#">Log in</a>
</p>
</div>
</main>
</body></html>
