<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle diagonal line pattern for background */
        .bg-pattern {
            background-color: #f7f9fb;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.02) 10px, rgba(0,0,0,0.02) 20px);
        }
    </style>

<body class="bg-pattern min-h-screen flex items-center justify-center font-body-md text-body-md text-on-surface antialiased p-container-margin">
<!-- Auth Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-md border border-outline-variant p-8 md:p-10 relative overflow-hidden">
<!-- Logo Header -->
<header class="flex flex-col items-center mb-8">
<img alt="Tournament Pro Logo" class="h-16 w-16 mb-4 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VHzVcgrlrr2xwU1_DxRZgwYLMbeMgF-u4Gt8UPV016pS1B6Wlxc2taPOBzlTJNhwMLKXrRkpMl3QMNJXxNtA_AfegWQwXAcFlYvUppaMHmLzk3_dRgR6f-GPNu3guWU7m85Lu2cZ9uAH1Io8qR1WNqSP0lnsztC6MOWf82u3Q53CRtWFljyLz-cnZlSBul-aOj26HE40GUK2oZXCrlQ-vtmfo8U7UA40NJ2aPsF0eStsbKK-mrW_jirNiX"/>
<h1 class="font-headline-lg text-headline-lg text-primary text-center tracking-tight">Tournament Pro</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Log in to manage your leagues</p>
</header>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 bg-surface-container-low border-none rounded-DEFAULT focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest font-body-md text-body-md text-on-surface py-3 transition-colors" id="email" name="email" placeholder="admin@tournamentpro.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 bg-surface-container-low border-none rounded-DEFAULT focus:ring-2 focus:ring-accent-blue focus:bg-surface-container-lowest font-body-md text-body-md text-on-surface py-3 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Optional: Add show password toggle here -->
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded-sm border-outline text-accent-blue focus:ring-accent-blue bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-accent-blue hover:text-primary transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-accent-blue hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-blue transition-all duration-200 uppercase tracking-wider" type="submit">
                    Log In
                </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-label-xs text-label-xs text-outline uppercase">Or continue with</span>
</div>
</div>
<!-- Social Login Options -->
<div class="mt-6 grid grid-cols-2 gap-3">
<a class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-DEFAULT shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low hover:border-accent-blue transition-colors group" href="#">
<span class="material-symbols-outlined text-outline group-hover:text-accent-blue mr-2 text-[18px]">login</span> Google
            </a>
<a class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-DEFAULT shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low hover:border-accent-blue transition-colors group" href="#">
<span class="material-symbols-outlined text-outline group-hover:text-accent-blue mr-2 text-[18px]">devices</span> Apple
            </a>
</div>
<!-- Registration Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-accent-blue hover:text-primary transition-colors ml-1" href="#">
                    Sign up
                </a>
</p>
</div>
</main>
</body></html>
